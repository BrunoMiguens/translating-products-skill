name: Validate translation skills

on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Offline repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generated catalog
        run: python3 scripts/render_catalog.py --check
      - name: Validate repository
        run: python3 scripts/validate_repo.py
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v

  verify-pinned-sources:
    name: Verify immutable upstream sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source locks
        run: python3 scripts/verify_sources.py
